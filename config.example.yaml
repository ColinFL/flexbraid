# FlexBraid example configuration.
# Copy to config.yaml (or client.yaml / server.yaml) and edit.
# Full reference: docs/CONFIG.md

mode: client            # "client" | "server"
listen: 0.0.0.0:51820   # client: where inner traffic (WireGuard) points at.
                        # server: where FlexBraid clients connect.
server: 203.0.113.1:4096   # (client only) FlexBraid server address:port
wg_peer: 127.0.0.1:51820   # (server only) inner WireGuard peer (egress target)
session_id: auto        # "auto" (random) | <hex>; server keys sessions by this,
                        # NOT by source IP — the basis of seamless failover.
mtu: 1388               # inner MTU. With FEC on: 1500 − 44 (frame+tag) − 68
                        # (parity sub-header, k=10) = 1388; 1420 only with FEC off.

# --- scheduler -----------------------------------------------------------
scheduler:
  mode: lb              # "lb" (active load balance) | "standby" (warm standby)
  affinity: packet      # "packet" (per-frame, default) | "flow" (per-connection)
  balance_by: capacity  # lb only: "capacity" | "fec" | "roundrobin"
  capacity_cap_mbps: 0  # (server only) clamp on the capacity a client may
                        # declare; 0 = trust the client (not recommended)

# --- forward error correction (can be fully disabled) --------------------
fec:
  enabled: true
  mode: adaptive        # "adaptive" | "fixed" | "off" | "crosspath"
                        # adaptive = LIVE: no loss → pass-through (0 latency,
                        # 0 overhead); loss ≥ adapt_min_loss_pct → coding with
                        # redundancy sized to measured loss.
                        # crosspath = blocks spread across ALL WANs: a whole
                        # WAN failure loses only its share of each block,
                        # recoverable via parity (needs affinity: packet).
  data_shards: 10       # data frames per RS block (games: 4–6, see docs)
  max_loss_pct: 20      # redundancy ceiling (compensable random-loss % per path)
  block_timeout_ms: 8   # block collection window; adds latency only while coding
  fixed_overhead_pct: 25  # used only when mode: fixed
  adapt_min_loss_pct: 2  # coding ON when measured loss ≥ 2%
  adapt_resume_pct: 0.5  # coding OFF when loss < 0.5%
  adapt_hold_sec: 10     # minimum time coding stays on (anti-flap)
  protection_level: 0.5  # (crosspath) redundancy floor as fraction of
                         # data_shards: 0.5 → ≥ ceil(k·0.5) parity per block.
                         # 1.0 survives losing one whole WAN in a 2-WAN setup
                         # (at 2× wire traffic); default 0.5.

# --- WANs: one entry per physical uplink (any number) --------------------
wans:
  - id: w1
    transport: udp     # "udp" | "faketcp" (raw TCP disguise, root+RST
                        # suppression) | "icmp" (ping disguise, root, pull-mode)
    iface: igc1         # bind device (SO_BINDTODEVICE / IP_BOUND_IF).
                        # Requires root/CAP_NET_RAW; falls back to local_ip.
    local_ip: ""        # bind source address instead (no privileges; needs
                        # the IP on the box + OS policy routing)
    capacity_mbps: 300  # declared bandwidth → drives capacity-weighted balancing
    weight: 1.0
    # fec_max_loss_pct: 20   # optional per-path FEC override

  - id: w2
    transport: udp
    iface: igc0
    local_ip: ""
    capacity_mbps: 100
    weight: 1.0

# --- delivery: in-order reassembly window (client side) ------------------
delivery:
  gap_timeout_ms: 100   # max head-of-line blocking when a frame is missing.
                        # Must cover the RTT skew between paths (cable+LTE
                        # mixes routinely need 100ms+).
  max_pending: 4096     # reorder-buffer bound (BDP guard; drop-oldest)

# --- health: monitoring & circuit breaker --------------------------------
health:
  loss_alpha_fast: 0.4   # fast-rise EWMA weight (reacts to spikes)
  loss_alpha_slow: 0.03  # slow-decay EWMA weight (settles slowly)
  jitter_alpha: 0.1
  degrade_sec: 3         # sustained loss above FEC cap → DEGRADED
  down_after_misses: 3   # consecutive unanswered probes → DOWN
  down_grace_sec: 1      # debounce before DOWN (anti-flap); 0 = immediate
  recover_min: 2         # stability window before a path is restored
  probe_interval: 1      # keepalive probe period (s). Loss is ALSO measured
                         # in-band from real traffic (no probe latency).

# --- crypto --------------------------------------------------------------
crypto:
  key: "change-me"            # shared PSK (required); AEAD keys derived from it
  cipher: chacha20poly1305    # "chacha20poly1305" | "aes256gcm"

# --- logging -------------------------------------------------------------
log:
  level: info   # debug | info | warn | error
  file: ""

# --- telemetry (M5.1) -----------------------------------------------------
# Both knobs default to off; a firewall box stays quiet unless you opt in.
telemetry:
  listen: ""          # "127.0.0.1:9080" — HTTP JSON snapshot. Empty = off.
  path: /stats        # HTTP path (only used when listen is set; no auth)
  interval_sec: 0     # >0: periodic JSON snapshot via structured log. 0 = off.

# --- queue: bounded per-WAN send queue + rate limiter (M5.3, §7.6) --------
# WireGuard has no congestion control; without this a fast WAN can
# bufferbloat a slow one and memory grows without bound.
queue:
  enabled: true       # false disables the queue + rate limiter entirely
  max_bytes: 262144   # per-WAN outbound queue bound (BDP-ish memory guard)
  drop: oldest        # overflow policy: "oldest" (TCP-ish) | "newest" (real-time)
  rate_limit: true    # pace each WAN to wans[].capacity_mbps (token bucket)

# --- runtime reload (M5.2) --------------------------------------------------
# Send SIGHUP to re-read this file. Applied live: scheduler capacities,
# delivery gap_timeout/max_pending, health tuning, log level. Structural
# changes (listeners, transports, crypto key, WAN topology, FEC mode,
# scheduler mode) require a restart — the reload is rejected and the
# previous settings stay in force.
