name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build · vet · race · cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race ./...

      - name: faketcp loopback (raw sockets, docker NET_RAW)
        # The unprivileged runner cannot open raw sockets; run the
        # loopback transport test inside a container with NET_RAW
        # (docker on GitHub runners needs sudo).
        run: |
          sudo docker run --rm --cap-add=NET_RAW \
            -v "$PWD":/src -w /src golang:$(grep '^go ' go.mod | awk '{print $2}') \
            go test ./internal/transport/ -run 'TestFakeTCPLoopback' -v -count=1

      - name: cross-compile (linux / freebsd / windows)
        run: |
          GOOS=linux   GOARCH=amd64 go build ./...
          GOOS=freebsd GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...

      - name: build dist binaries
        run: make cross

      - name: config smoke test
        run: |
          # The shipped example binds sockets to igc1/igc0 (OPNsense
          # names); strip device/source binding so the client can start
          # on a bare runner. It must keep running until the timeout
          # (124) — crashing at startup is a regression.
          sed -E '/^[[:space:]]+(iface|local_ip):/d' config.example.yaml > /tmp/smoke-config.yaml
          ./dist/flexbraid-linux-amd64 -version
          set +e
          timeout 2 ./dist/flexbraid-linux-amd64 -c /tmp/smoke-config.yaml > /tmp/smoke.log 2>&1
          rc=$?
          set -e
          echo "smoke rc=$rc (want 124)"
          if [ "$rc" -ne 124 ]; then
            echo "=== client log ==="
            cat /tmp/smoke.log
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: flexbraid-binaries
          path: dist/

  windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test ./...
